# Fontes de dados do Grafana, já configuradas e CORRELACIONADAS entre si:
#   métrica (exemplar) ──> trace       log (trace_id) ──> trace       trace ──> logs
# Obs.: em arquivos de provisionamento, "$$" é um "$" literal.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 5s
      # Pontinhos (exemplars) nos gráficos de latência abrem o trace no Tempo
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
          urlDisplayLabel: Abrir trace no Tempo

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      maxLines: 1000
      # Encontra o trace_id dentro do JSON do log e cria um botão para o Tempo
      derivedFields:
        - name: trace_id
          matcherType: regex
          matcherRegex: '"trace_id":"(\w+)"'
          url: '$${__value.raw}'
          datasourceUid: tempo
          urlDisplayLabel: Abrir trace no Tempo

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: true
    jsonData:
      # Do trace para os logs daquele mesmo trace
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        customQuery: true
        query: '{app="pizzaria"} | json | trace_id="$${__trace.traceId}"'
      # Mapa de serviços (gerado pelo metrics-generator do Tempo)
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      search:
        hide: false
      traceQuery:
        timeShiftEnabled: true
        spanStartTimeShift: '-30m'
        spanEndTimeShift: '30m'
