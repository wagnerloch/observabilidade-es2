# Grafana Loki: armazena e consulta LOGS.
# Diferente de um Elasticsearch, o Loki NÃO indexa o texto dos logs — só as
# labels (app, service_name, level). Isso o torna barato; o filtro do texto
# acontece na hora da consulta (LogQL).

auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /tmp/loki
  storage:
    filesystem:
      chunks_directory: /tmp/loki/chunks
      rules_directory: /tmp/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  volume_enabled: true

pattern_ingester:
  enabled: true

analytics:
  reporting_enabled: false
