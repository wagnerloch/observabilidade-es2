# Prometheus: coleta (scrape) métricas no modelo PULL.
global:
  scrape_interval: 5s       # de quanto em quanto tempo visitar cada /metrics
  evaluation_interval: 5s

scrape_configs:
  # Os três microsserviços da pizzaria
  - job_name: pizzaria
    metrics_path: /metrics
    static_configs:
      - targets: ['pedidos:3000', 'pagamentos:3000', 'cozinha:3000']

  # O próprio Prometheus e o Tempo também expõem métricas sobre si mesmos
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: tempo
    static_configs:
      - targets: ['tempo:3200']
