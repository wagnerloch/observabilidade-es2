# Grafana Tempo: armazena e consulta TRACES distribuídos.
# Configuração mínima para rodar localmente (dados em /tmp, retenção de 1h).

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

# Recebe spans no protocolo OTLP (OpenTelemetry)
distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: "0.0.0.0:4318"
        grpc:
          endpoint: "0.0.0.0:4317"

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 1h

# Gera métricas A PARTIR dos traces e envia ao Prometheus:
#   - service-graphs -> "mapa de serviços" (quem chama quem)
#   - span-metrics   -> taxa/erros/duração por operação (RED)
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /tmp/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /tmp/tempo/generator/traces

storage:
  trace:
    backend: local
    wal:
      path: /tmp/tempo/wal
    local:
      path: /tmp/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics, local-blocks]
